<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>retrospect-agent runs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --panel2: #1d2230;
    --fg: #e6e7eb; --muted: #8b91a3; --accent: #7aa2f7; --good: #9ece6a; --bad: #f7768e; --warn: #e0af68;
    --border: #262b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── Header ── */
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .tab-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .tab-btn.active { border-color: var(--accent); color: var(--accent); background: #1a2035; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; }

  /* ── Shared layout ── */
  main { display: flex; min-height: calc(100vh - 49px); }

  /* ── Runs view ── */
  #view-runs { display: flex; width: 100%; }
  aside { width: 340px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  aside .filter-bar { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  aside .filter-bar input { flex: 1; background: var(--panel2); color: var(--fg); border: 1px solid var(--border); padding: 5px 9px; border-radius: 6px; font: inherit; font-size: 12px; }
  aside .filter-bar button { background: var(--panel2); border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 11px; }
  aside .row { padding: 9px 13px; border-bottom: 1px solid var(--border); cursor: pointer; }
  aside .row:hover { background: var(--panel); }
  aside .row.active { background: var(--panel2); }
  aside .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  aside .kind { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--panel2); margin-right: 5px; font-size: 10px; text-transform: uppercase; }
  .status-completed { color: var(--good); }
  .status-failed { color: var(--bad); }
  .status-running { color: var(--accent); }
  section.detail { flex: 1; padding: 20px; overflow-y: auto; }

  /* ── Users view ── */
  #view-users { width: 100%; padding: 24px; overflow-y: auto; display: none; }
  .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .user-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color .15s; }
  .user-card:hover { border-color: var(--accent); }
  .user-card .email { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-card .uid { font-size: 10px; color: var(--muted); margin-bottom: 10px; }
  .user-card .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .user-card .stat { background: var(--panel2); border-radius: 6px; padding: 7px 10px; }
  .user-card .stat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .user-card .stat .v { font-size: 17px; font-weight: 700; margin-top: 1px; }
  .user-card .stat .v.cost { color: var(--warn); }
  .user-card .last { font-size: 11px; color: var(--muted); margin-top: 10px; }

  .totals-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; display: flex; gap: 32px; flex-wrap: wrap; }
  .totals-bar .t { }
  .totals-bar .t .k { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .totals-bar .t .v { font-size: 22px; font-weight: 700; }
  .totals-bar .t .v.cost { color: var(--warn); }

  /* ── Shared detail panels ── */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
  .panel h2 { margin: 0; padding: 11px 15px; font-size: 13px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .panel h2::before { content: "▼ "; color: var(--muted); }
  .panel.collapsed h2::before { content: "▶ "; }
  .panel .body { padding: 15px; }
  .panel.collapsed .body { display: none; }
  pre { white-space: pre-wrap; word-wrap: break-word; background: var(--panel2); padding: 12px; border-radius: 6px; max-height: 480px; overflow-y: auto; font-size: 12.5px; }
  .toolcall { background: var(--panel2); border-left: 3px solid var(--accent); padding: 10px 12px; margin-bottom: 10px; border-radius: 0 6px 6px 0; }
  .toolcall .tool { font-weight: 600; color: var(--accent); }
  .toolcall .meta { color: var(--muted); font-size: 12px; }
  .toolcall pre { margin-top: 6px; max-height: 220px; }
  .cost-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .cost-grid .cell { background: var(--panel2); padding: 8px 12px; border-radius: 6px; }
  .cost-grid .cell .k { color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .cost-grid .cell .v { font-size: 16px; font-weight: 600; }
  audio { width: 100%; margin-top: 8px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--panel2); font-size: 11px; color: var(--muted); margin-left: 6px; }
  .script { white-space: pre-wrap; background: var(--panel2); padding: 18px; border-radius: 6px; font: 14px/1.65 ui-sans-serif, system-ui; max-height: 500px; overflow-y: auto; }
  .user-banner { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px; }
  .user-banner .lbl { font-size: 11px; color: var(--muted); }
  .user-banner button { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 5px; cursor: pointer; font: inherit; font-size: 11px; }
  .user-banner button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>retrospect-agent</h1>
  <button class="tab-btn active" id="tab-runs" onclick="switchTab('runs')">Runs</button>
  <button class="tab-btn" id="tab-users" onclick="switchTab('users')">Users</button>
  <a href="/podcast-test" style="margin-left:auto;">podcast test</a>
</header>
<main>
  <!-- USERS TAB -->
  <div id="view-users">
    <div id="totals-bar" class="totals-bar"></div>
    <div id="user-grid" class="user-grid"></div>
  </div>

  <!-- RUNS TAB -->
  <div id="view-runs">
    <aside>
      <div class="filter-bar">
        <input id="filter-user" placeholder="filter by userId…" />
        <button onclick="clearFilter()">clear</button>
      </div>
      <div id="list"></div>
    </aside>
    <section class="detail" id="detail">
      <div class="empty">Pick a run on the left.</div>
    </section>
  </div>
</main>

<script>
  // ── Routing ──────────────────────────────────────────────────────────────
  const pathParts = location.pathname.split('/').filter(Boolean);
  const initialRunId = pathParts[0] === 'runs' && pathParts[1] && pathParts[1] !== 'latest' ? pathParts[1] : null;
  let activeTab = 'runs';

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('view-runs').style.display = tab === 'runs' ? 'flex' : 'none';
    document.getElementById('view-users').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('tab-runs').classList.toggle('active', tab === 'runs');
    document.getElementById('tab-users').classList.toggle('active', tab === 'users');
    if (tab === 'users') loadUsers();
  }

  function clearFilter() {
    document.getElementById('filter-user').value = '';
    loadList();
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtJson(obj) { return `<pre>${escapeHtml(JSON.stringify(obj, null, 2))}</pre>`; }
  function ago(iso) {
    if (!iso) return '—';
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
  }

  function panel(id, title, bodyHtml, opts = {}) {
    return `<div class="panel ${opts.collapsed ? 'collapsed' : ''}" id="panel-${id}">
      <h2 onclick="this.parentElement.classList.toggle('collapsed')">${title}</h2>
      <div class="body">${bodyHtml}</div>
    </div>`;
  }

  function renderCost(c) {
    if (!c) return '';
    return `<div class="cost-grid">
      <div class="cell"><div class="k">openai in</div><div class="v">${c.openai_tokens_input ?? 0}</div></div>
      <div class="cell"><div class="k">openai out</div><div class="v">${c.openai_tokens_output ?? 0}</div></div>
      <div class="cell"><div class="k">anthropic in</div><div class="v">${c.anthropic_tokens_input ?? 0}</div></div>
      <div class="cell"><div class="k">anthropic out</div><div class="v">${c.anthropic_tokens_output ?? 0}</div></div>
      <div class="cell"><div class="k">embed tokens</div><div class="v">${c.embedding_tokens ?? 0}</div></div>
      <div class="cell"><div class="k">perplexity calls</div><div class="v">${c.perplexity_calls ?? 0}</div></div>
      <div class="cell"><div class="k">11labs chars</div><div class="v">${c.elevenlabs_chars ?? 0}</div></div>
      <div class="cell"><div class="k">est. USD</div><div class="v" style="color:var(--warn)">$${c.est_usd ?? 0}</div></div>
    </div>`;
  }

  function renderToolCalls(calls) {
    if (!calls || calls.length === 0) return '<div class="empty">No tool calls.</div>';
    return calls.map((c) => `<div class="toolcall">
      <div><span class="tool">${c.tool}</span> <span class="meta">iter ${c.iteration} · ${c.duration_ms}ms · ${c.result_count ?? '?'} results</span></div>
      <div class="meta">args:</div><pre>${escapeHtml(JSON.stringify(c.arguments, null, 2))}</pre>
      <div class="meta">result preview:</div><pre>${escapeHtml(c.result_preview || '')}</pre>
    </div>`).join('');
  }

  function renderContextData(ctx) {
    let html = '';
    if (ctx.goals?.length) {
      html += '<h3 style="margin:0 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Goals</h3>';
      html += ctx.goals.map(g => `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;">
        <div style="font-weight:600;">${escapeHtml(g.title ?? '(untitled)')}</div>
        ${g.description ? `<div style="color:var(--muted);margin-top:4px;">${escapeHtml(g.description)}</div>` : ''}
      </div>`).join('');
    }
    if (ctx.insights?.length) {
      html += `<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Insights</h3>`;
      html += ctx.insights.map(i => `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:3px solid var(--accent);">
        <div style="font-weight:600;">${escapeHtml(i.title ?? '')}</div>
        <div style="margin-top:6px;">${escapeHtml(i.content ?? '')}</div>
        ${i.evidence_summary ? `<div style="color:var(--muted);margin-top:6px;font-size:12px;">Evidence: ${escapeHtml(i.evidence_summary)}</div>` : ''}
        <div style="color:var(--muted);font-size:11px;margin-top:4px;">${i.created_at ? new Date(i.created_at).toLocaleDateString() : ''}</div>
      </div>`).join('');
    }
    if (ctx.identity_inferences?.length) {
      html += `<h3 style="margin:0 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Identity Inferences (${ctx.identity_inferences.length})</h3>`;
      html += ctx.identity_inferences.map(i => {
        const state = i.retired_at
          ? `<span style="background:#3a1f24;color:var(--bad);padding:1px 6px;border-radius:4px;font-size:10px;">RETIRED</span>`
          : i.is_provisional
            ? `<span style="background:#2a2a3a;color:var(--muted);padding:1px 6px;border-radius:4px;font-size:10px;">PROVISIONAL</span>`
            : `<span style="background:#1f3a2a;color:var(--good);padding:1px 6px;border-radius:4px;font-size:10px;">CONFIRMED</span>`;
        return `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:3px solid #b07ae8;">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
            <span style="font-size:10px;text-transform:uppercase;color:var(--muted);background:var(--panel);padding:1px 6px;border-radius:4px;">${escapeHtml(i.domain ?? '')}</span>
            <span style="font-size:11px;color:var(--muted);">confidence ${i.confidence_score}</span>
            ${state}
          </div>
          <div>${escapeHtml(i.content ?? '')}</div>
          ${i.evidence_summary ? `<div style="color:var(--muted);margin-top:6px;font-size:12px;">Evidence: ${escapeHtml(i.evidence_summary)}</div>` : ''}
        </div>`;
      }).join('');
    }
    if (ctx.user_understanding_document) {
      const doc = ctx.user_understanding_document;
      const version = ctx.user_understanding_version;
      html += `<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">User Understanding Document${version != null ? ` — v${version}` : ''}</h3>`;
      if (ctx.user_understanding_generation_notes) {
        html += `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic;">Cook 0 notes: ${escapeHtml(ctx.user_understanding_generation_notes)}</div>`;
      }
      const sec = (label, body) => body ? `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;">
        <div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">${label}</div>
        <div style="white-space:pre-wrap;">${escapeHtml(body)}</div></div>` : '';
      html += sec('Identity Core', doc.identity_core);
      if (doc.active_goals?.length) {
        html += `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;">
          <div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Active Goals</div>
          ${doc.active_goals.map(g => `<div style="margin-bottom:6px;"><strong>${escapeHtml(g.title ?? '')}</strong><div style="color:var(--muted);font-size:12px;">${escapeHtml(g.what_its_really_about ?? '')}</div></div>`).join('')}
        </div>`;
      }
      html += sec('Behavioral Patterns', doc.behavioral_patterns);
      html += sec('Emotional Baseline', doc.emotional_baseline);
      if (doc.live_tensions?.length) {
        html += `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;">
          <div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Live Tensions</div>
          ${doc.live_tensions.map(t => `<div style="margin-bottom:4px;">• ${escapeHtml(t)}</div>`).join('')}
        </div>`;
      }
      html += sec('Track Record', doc.track_record);
      html += sec('Forward Focus', doc.forward_focus);
      if (doc.emerging_dimensions?.length) {
        html += `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:3px solid #b07ae8;">
          <div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Emerging Dimensions</div>
          ${doc.emerging_dimensions.map(d => `<div style="margin-bottom:8px;"><strong>${escapeHtml(d.label ?? '')}</strong><div style="white-space:pre-wrap;color:var(--muted);font-size:13px;">${escapeHtml(d.content ?? '')}</div></div>`).join('')}
        </div>`;
      }
    }
    if (ctx.observations?.length) {
      html += `<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Observations (${ctx.observations.length})</h3>`;
      html += ctx.observations.map(o => `<div style="background:var(--panel2);padding:8px 14px;border-radius:6px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;">
        <div style="color:var(--muted);font-size:11px;white-space:nowrap;margin-top:2px;">${o.observation_date ? o.observation_date.slice(0,10) : ''}</div>
        <div>${escapeHtml(o.content ?? '')}</div>
      </div>`).join('');
    }
    if (ctx.onboardingProfile) {
      html += '<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Onboarding Profile</h3>';
      html += `<pre>${escapeHtml(ctx.onboardingProfile.content ?? '')}</pre>`;
    }
    if (ctx.rawContent?.length) {
      html += `<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Ingested Entries (${ctx.rawContent.length})</h3>`;
      html += ctx.rawContent.map(r => `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;">
        <div style="color:var(--muted);font-size:11px;margin-bottom:6px;">${escapeHtml(r.content_type ?? '')} · ${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</div>
        <div style="white-space:pre-wrap;">${escapeHtml((r.content ?? '').slice(0, 800))}${r.content?.length > 800 ? '…' : ''}</div>
      </div>`).join('');
    }
    if (ctx.sourceEntries?.length) {
      html += `<h3 style="margin:16px 0 8px;font-size:11px;text-transform:uppercase;color:var(--muted);">Source Journal Entries (${ctx.sourceEntries.length})</h3>`;
      html += ctx.sourceEntries.map(r => `<div style="background:var(--panel2);padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:3px solid #7c6f5e;">
        <div style="color:var(--muted);font-size:11px;margin-bottom:6px;">${escapeHtml(r.content_type ?? '')} · ${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</div>
        <div style="white-space:pre-wrap;">${escapeHtml((r.content ?? '').slice(0, 1000))}${(r.content ?? '').length > 1000 ? '…' : ''}</div>
      </div>`).join('');
    }
    return html || '<div class="empty">No source data.</div>';
  }

  // ── Runs list ─────────────────────────────────────────────────────────────
  async function loadList() {
    const userId = document.getElementById('filter-user').value.trim();
    const qs = userId ? `?userId=${encodeURIComponent(userId)}&json=1` : '?json=1';
    const res = await fetch(`/runs${qs}`);
    const { runs = [] } = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';

    // If filtered to a user, show a banner
    const banner = document.querySelector('.user-banner');
    if (banner) banner.remove();

    if (userId) {
      const b = document.createElement('div');
      b.className = 'user-banner';
      b.innerHTML = `<div><div class="lbl">filtered to user</div><div style="font-size:12px;">${escapeHtml(userId)}</div></div>
        <button onclick="clearFilter()">show all</button>`;
      document.getElementById('detail').before(b);
    }

    runs.forEach((r) => {
      const div = document.createElement('div');
      div.className = 'row';
      div.dataset.id = r.id;
      div.innerHTML = `
        <div><span class="kind">${r.kind}</span><span class="status-${r.status}">${r.status}</span>${r.notes ? `<span class="pill">${r.notes}</span>` : ''}</div>
        <div class="meta">${new Date(r.started_at).toLocaleString()} · ${r.duration_ms != null ? (r.duration_ms/1000).toFixed(1)+'s · ' : ''}$${r.cost_breakdown?.est_usd ?? 0}</div>
        <div class="meta" style="font-size:10px;color:#555;">${r.id}</div>
      `;
      div.addEventListener('click', () => loadRun(r.id));
      list.appendChild(div);
    });
    if (initialRunId) loadRun(initialRunId);
  }

  async function loadRun(id) {
    history.replaceState(null, '', `/runs/${id}`);
    document.querySelectorAll('aside .row').forEach((r) => r.classList.toggle('active', r.dataset.id === id));
    const res = await fetch(`/runs/${id}?json=1`);
    if (!res.ok) { document.getElementById('detail').innerHTML = '<div class="empty">Run not found.</div>'; return; }
    const { run } = await res.json();
    const sections = [];

    sections.push(panel('meta', `${run.kind.toUpperCase()} <span class="pill">${run.status}</span>`, `
      <div class="meta">id: ${run.id}</div>
      <div class="meta">user: ${run.user_id}</div>
      <div class="meta">started: ${new Date(run.started_at).toLocaleString()}</div>
      <div class="meta">finished: ${run.finished_at ? new Date(run.finished_at).toLocaleString() : '—'}</div>
      <div class="meta">duration: ${run.duration_ms != null ? (run.duration_ms/1000).toFixed(1)+'s' : '—'}</div>
      <div class="meta">triggered by: ${run.triggered_by}</div>
      ${run.notes ? `<div class="meta">notes: ${escapeHtml(run.notes)}</div>` : ''}
      ${run.error_message ? `<div style="color:var(--bad);margin-top:8px;">${escapeHtml(run.error_message)}</div>` : ''}
      <h3 style="margin:14px 0 8px;font-size:12px;">Cost breakdown</h3>
      ${renderCost(run.cost_breakdown)}
    `));

    if (run.inputs_snapshot) sections.push(panel('inputs', 'Inputs snapshot', fmtJson(run.inputs_snapshot), { collapsed: true }));
    if (run.context_data) sections.push(panel('context', 'Source data (what went in)', renderContextData(run.context_data)));
    if (run.outline_v1) sections.push(panel('o1', 'Cook A — Outline v1', fmtJson(run.outline_v1)));
    sections.push(panel('tools', `Cook B — Agent tool calls (${(run.agent_tool_calls || []).length})`, renderToolCalls(run.agent_tool_calls)));
    if (run.outline_v2) sections.push(panel('o2', 'Cook B — Outline v2 (enriched)', fmtJson(run.outline_v2)));
    if (run.final_script) sections.push(panel('script', 'Cook C — Final script', `<div class="script">${escapeHtml(run.final_script)}</div>`));
    if (run.audio_url) sections.push(panel('audio', 'Audio', `<audio controls src="${run.audio_url}"></audio>`));
    if (run.episode_summary) sections.push(panel('summary', 'Episode summary', `<div class="script">${escapeHtml(run.episode_summary)}</div>`));

    document.getElementById('detail').innerHTML = sections.join('\n');
  }

  // ── Users view ────────────────────────────────────────────────────────────
  async function loadUsers() {
    const res = await fetch('/runs/users?json=1');
    const { users = [] } = await res.json();

    const totalCost = users.reduce((s, u) => s + (u.total_cost ?? 0), 0);
    const totalRuns = users.reduce((s, u) => s + u.run_count, 0);
    const totalPodcasts = users.reduce((s, u) => s + u.podcast_count, 0);

    document.getElementById('totals-bar').innerHTML = `
      <div class="t"><div class="k">Total Users</div><div class="v">${users.length}</div></div>
      <div class="t"><div class="k">Total Runs</div><div class="v">${totalRuns}</div></div>
      <div class="t"><div class="k">Podcasts Generated</div><div class="v">${totalPodcasts}</div></div>
      <div class="t"><div class="k">Total Spend</div><div class="v cost">$${totalCost.toFixed(4)}</div></div>
    `;

    document.getElementById('user-grid').innerHTML = users.map(u => `
      <div class="user-card" onclick="drillUser('${u.user_id}')">
        <div class="email">${escapeHtml(u.email ?? '(no email)')}</div>
        <div class="uid">${u.user_id}</div>
        <div class="stats">
          <div class="stat"><div class="k">Total cost</div><div class="v cost">$${(u.total_cost ?? 0).toFixed(4)}</div></div>
          <div class="stat"><div class="k">Podcasts</div><div class="v">${u.podcast_count}</div></div>
          <div class="stat"><div class="k">Ingest runs</div><div class="v">${u.ingest_count}</div></div>
          <div class="stat"><div class="k">Failed</div><div class="v" style="color:${u.failed_count > 0 ? 'var(--bad)' : 'var(--muted)'}">${u.failed_count}</div></div>
        </div>
        <div class="last">last active ${ago(u.last_run_at)} · joined ${u.joined_at ? new Date(u.joined_at).toLocaleDateString() : '—'}</div>
      </div>
    `).join('');
  }

  function drillUser(userId) {
    document.getElementById('filter-user').value = userId;
    switchTab('runs');
    loadList();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  document.getElementById('filter-user').addEventListener('input', () => {
    clearTimeout(window.__t);
    window.__t = setTimeout(loadList, 300);
  });

  loadList();
</script>
</body>
</html>
